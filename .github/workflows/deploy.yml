name: Build and deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/malte0v0/portfolioapi:latest -t ghcr.io/malte0v0/portfolioapi:${{ github.sha }} .

      - name: Push image
        run: docker push --all-tags ghcr.io/malte0v0/portfolioapi
